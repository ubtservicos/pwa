# =============================================================================
# Supabase Local Development Configuration
# Generated for Supabase CLI v2.x
# Project: UBT Serviços — ubtservicos/pwa
# Project ID: xqujubbqcfqxkfczbidq
# =============================================================================

# A string used to distinguish different Supabase projects on the same host.
# Defaults to the working directory name when running `supabase init`.
project_id = "ubt-pwa"

# =============================================================================
# [api] — PostgREST configuration
# =============================================================================
[api]
enabled = true
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this
# schema will get API endpoints.
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returned from a View, Table, or Stored Procedure.
# Limits payload size for accidental or malicious requests.
max_rows = 1000

# =============================================================================
# [db] — Local Postgres configuration
# =============================================================================
[db]
# Port to use for the local database URL.
port = 54322
# Port used by pg_dump and pg_restore when migrating between different Postgres versions.
shadow_port = 54320
# The database major version to use. This has to be the same as your remote database's.
# Run `SHOW server_version;` on the remote database to check.
major_version = 15

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54329
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

# =============================================================================
# [realtime] — Realtime configuration
# =============================================================================
[realtime]
enabled = true
# Bind realtime via either IPv4 or IPv6. (default: IPv6)
ip_version = "IPv6"
# The maximum length in bytes of HTTP request headers. (default: 4096)
max_header_length = 4096

# =============================================================================
# [studio] — Supabase Studio
# =============================================================================
[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"
# OpenAI API Key to use for Supabase AI in the Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# =============================================================================
# [local_smtp] — Email testing server (dev only, replaces deprecated [inbucket])
# =============================================================================
[local_smtp]
enabled = true
# Port to use for the email testing server web interface.
port = 54324
smtp_port = 54325

# =============================================================================
# [storage] — Object storage
# =============================================================================
[storage]
enabled = true
# The maximum file size allowed (e.g. "5MiB", "500MB").
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = true

# =============================================================================
# [auth] — GoTrue authentication
# =============================================================================
[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails.
site_url = "http://127.0.0.1:3000"
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
additional_redirect_urls = ["https://127.0.0.1:3000"]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 (1 week).
jwt_expiry = 3600
# If disabled, the refresh token will never expire.
enable_refresh_token_rotation = true
# Allows refresh tokens to be reused after expiry, up to the specified interval in seconds.
# Requires enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Allow/disallow new user signups to your project.
enable_signup = true
# Allow/disallow testing manual linking of accounts
enable_manual_linking = false
# Passwords shorter than this value will be rejected as weak. Minimum 6, recommended 8 or more.
minimum_password_length = 6
# Passwords that do not meet the following requirements will be rejected as weak. Supported
# values: `letters_digits`, `lower_upper_letters_digits`, `lower_upper_letters_digits_symbols`
password_requirements = ""

[auth.email]
# Allow/disallow new user signups via email to your project.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email
# addresses. If disabled, only the new email is required to confirm.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in.
enable_confirmations = false
# If enabled, users will need to reauthenticate or have logged in recently to change their password.
secure_password_change = false
# Controls the minimum amount of time that must pass before sending another signup confirmation or
# password reset email.
max_frequency = "1s"
# Number of characters used in the email OTP.
otp_length = 6
# Number of seconds before the email OTP expires (defaults to 1 hour).
otp_expiry = 3600

# =============================================================================
# [auth.sms] — SMS / OTP providers (disabled by default for this project)
# =============================================================================
[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# =============================================================================
# [auth.mfa] — Multi-factor authentication
# =============================================================================
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# =============================================================================
# [auth.sessions]
# =============================================================================
[auth.sessions]
# Force log out after the specified duration.
timebox = "0"
# Force log out if the user has been inactive for the specified duration.
inactivity_timeout = "0"

# =============================================================================
# [edge_runtime] — Deno edge runtime
# =============================================================================
[edge_runtime]
enabled = true
# Configure one of the supported request policies: `oneshot`, `per_worker`.
# Use `oneshot` for hot reload during development, `per_worker` for production parity.
policy = "oneshot"
inspector_port = 8083

# =============================================================================
# [analytics] — Logflare (disabled for local dev)
# =============================================================================
[analytics]
enabled = false
port = 54327
# Configure one of the supported backends: `postgres`, `bigquery`.
backend = "postgres"

# =============================================================================
# [experimental] — Feature flags
# =============================================================================
[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"

# =============================================================================
# Edge Functions — Individual function configuration
# =============================================================================

[functions.payment-gateway]
enabled = true
verify_jwt = true

[functions.payment-webhook]
enabled = true
# Mercado Pago webhooks are server-to-server calls; JWT is not present.
# Authentication is performed via HMAC-SHA256 signature validation inside the function.
verify_jwt = false
