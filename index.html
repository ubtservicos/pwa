<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1B3E" />
    <title>UBT — O Superapp do Trabalhador</title>
    <meta name="description" content="UBT conecta prestadores e tomadores de serviço com taxas justas, transparência total e fortalecimento da comunidade." />
    <meta name="author" content="UBT Digital" />

    <meta property="og:title" content="UBT — O Superapp do Trabalhador" />
    <meta property="og:description" content="Conecte-se. Trabalhe. Lucre Mais. A plataforma que une prestadores e tomadores com taxas justas." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.png" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest-prod-v2.json" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js?v=20260909_v2', { updateViaCache: 'none' })
            .then(reg => {
              try { reg.update(); } catch (e) {}
            })
            .catch(err => {
              console.error('ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>

    <meta name="vercel-toolbar" content="off" />
    <meta name="vercel-edit-mode" content="off" />
    <script>
      window.__VERCEL_TOOLBAR__ = false;
    </script>
    <style>
      vercel-live-feedback,
      #vercel-toolbar,
      .__vercel-toolbar,
      [data-vercel-toolbar] {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&family=Sora:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
